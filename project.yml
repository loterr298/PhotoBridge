name: PhotoBridge
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    PHOTOBRIDGE_BUILD_COMMIT: local-unversioned
packages:
  PhotoBridge:
    path: .
targets:
  PhotoBridgeOrderProbe:
    type: application
    platform: iOS
    sources:
      - path: apps/iOS
        excludes: [PrivacyInfo.xcprivacy]
      - path: apps/iOS/PrivacyInfo.xcprivacy
        buildPhase: resources
    resources:
      - path: apps/iOS/Assets.xcassets
    dependencies:
      - package: PhotoBridge
        product: PhotoBridgeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.photobridge.OrderProbe
        INFOPLIST_FILE: apps/iOS/Info.plist
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.3.13
        CURRENT_PROJECT_VERSION: 17
schemes:
  PhotoBridgeOrderProbe:
    build:
      targets:
        PhotoBridgeOrderProbe: all
